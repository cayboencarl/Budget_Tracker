<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class = "container">
    <h1>Budget Tracker</h1>
    <h2>Create Transaction</h2>
<!-- ==================== LOGIN SECTION ==================== -->
    <div id = "loginSection">
        <h2>Login</h2>
        <form id  = "loginForm">
            <input 
                type="text"
                id = "loginUsername"
                placeholder = "Username"
                required
            >
            <input
                type = "password"
                id = "loginPassword"
                placeholder = "Password"
                required
            >
            <button type = "submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#" id = "toggleRegister">Sign Up</a></p>
    </div>
<!-- ==================== REGISTRATION SECTION (HIDDEN BY DEFAULT) ==================== -->
    <div id ="registerSection" style = "display: none;">
        <h2>Sign Up</h2>
        <form id = "registerForm">
            <input 
                type="text"
                id = "regUsername"
                placeholder = "Username"
                required    
            >
            <input 
                type="email"
                id = "regEmail"
                placeholder = "Email"
                required
            >
            <input 
                type="password"
                id = "regPassword"
                placeholder="Password"
                required
            >
            <button type = "submit">Sign Up</button>
        </form>
            <p>Already have an account? <a href="#" id = "toggleLogin">Login</a></p>
    </div>
    <!-- ==================== MAIN APP SECTION (HIDDEN UNTIL LOGGED IN) ==================== -->
<div id = "appSection" style="display: none;">
    <form id = "transactionForm">
        <input type = "text" id = "type" placeholder = "Type (income/expense)">
        <input type = "number" id = "amount" placeholder = "Amount">
        <input type = "text" id = "category" placeholder = "Category">
        <input type = "text" id = "description" placeholder = "Description">
        <input type = "date" id = "date" placeholder= "Date">
        <button type = "submit" id = "create">Create</button>
    </form>

    <h2>Transactions</h2>
    <div class = "button-group">
    <button id = "fetchBtn">See All Transactions</button>
    <button id = "selectBtn">Select</button>
    <button id = "deleteBtn" style = "display: none";>Delete</button>
    </div>
    <div id = "transactionsList"></div>
    <script src="script.js"></script>  
</div>
</body>
</html>
